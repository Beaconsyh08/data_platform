<header style="flex:0 0 auto;border-bottom:1px solid #1e293b;background:#0f172a;padding:12px 16px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div style="min-width:0">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b">{{ page_kind }}</div>
      <h1 style="margin:4px 0 0;max-width:720px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;line-height:1.35;font-weight:700;color:#f8fafc">{{ page_title }}</h1>
      {% if page_subtitle %}
      <p style="margin:4px 0 0;max-width:720px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#94a3b8">{{ page_subtitle }}</p>
      {% endif %}
    </div>
    <div style="min-width:0">
      {% set nav_compact = true %}
      {% include "visualize_dataset_nav.html" %}
    </div>
  </div>
</header>
