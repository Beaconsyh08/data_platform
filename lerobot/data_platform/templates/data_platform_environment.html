<meta name="data-platform-environment" content="{{ environment }}">
<meta name="data-platform-release" content="{{ release }}">
<script src="/environment.js"></script>
<style>
  #dp-environment-bar { position: sticky; top: 0; z-index: 10000; display: flex; flex-wrap: wrap;
    align-items: center; gap: 12px; padding: 6px 16px; font: 13px system-ui;
    background: {{ '#fff1c2' if environment == 'dev' else '#e8edf4' }}; color: #17243a; }
  #dp-environment-bar select { color: #17243a; background: white; padding: 3px; border-radius: 4px; }
  #dp-environment-bar .dp-production-deploy {
    display: inline-flex; align-items: center; justify-content: center; min-height: 34px;
    padding: 6px 12px; border: 1px solid #1d4ed8; border-radius: 6px;
    background: #1d4ed8; color: #fff; font: 600 13px/1.4 system-ui;
    cursor: pointer; box-shadow: 0 1px 2px #17243a26;
  }
  #dp-environment-bar .dp-production-deploy:hover:not(:disabled) {
    background: #1e40af; border-color: #1e40af;
  }
  #dp-environment-bar .dp-production-deploy:focus-visible {
    outline: 3px solid #2563eb; outline-offset: 3px;
  }
  #dp-environment-bar .dp-production-deploy:disabled {
    background: #e2e8f0; border-color: #94a3b8; color: #475569;
    cursor: not-allowed; box-shadow: none; opacity: 1;
  }
  .dp-acceptance-dialog { width: min(560px, calc(100vw - 40px)); max-height: 85vh; overflow: auto;
    box-sizing: border-box; margin: auto; padding: 24px; border: 1px solid #64748b; border-radius: 12px;
    background: #fff; color: #17243a; font: 14px/1.5 system-ui; }
  .dp-acceptance-dialog::backdrop { background: #0f172a99; }
  .dp-acceptance-dialog h2 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
  .dp-acceptance-dialog p { margin: 12px 0; }
  .dp-acceptance-dialog fieldset { padding: 12px; border: 1px solid #cbd5e1; }
  .dp-acceptance-dialog label { display: flex; align-items: baseline; gap: 8px; margin: 12px 0; }
  .dp-acceptance-dialog input { appearance: auto; width: 16px; height: 16px; flex-shrink: 0; }
  .dp-acceptance-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
  .dp-acceptance-dialog button { padding: 8px 12px; border: 1px solid #64748b; border-radius: 6px; cursor: pointer; }
  .dp-acceptance-dialog button[type="submit"] { background: #1d4ed8; color: white; }
  .dp-acceptance-dialog button:disabled { background: #e2e8f0; color: #475569; cursor: not-allowed; }
  .dp-acceptance-dialog button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  #dp-environment-bar [hidden], .dp-deployment-dialog [hidden] { display: none; }
  .dp-deployment-dialog progress { width: 100%; height: 12px; accent-color: #2563eb; }
  .dp-deployment-dialog ol { max-height: 240px; overflow: auto; padding-left: 24px; list-style: decimal; }
  .dp-deployment-dialog li { margin: 8px 0; }
  .dp-deployment-dialog [data-status="failed"] { color: #b91c1c; font-weight: 600; }
  .dp-deployment-dialog [data-status="installed"] { color: #047857; font-weight: 600; }
</style>
