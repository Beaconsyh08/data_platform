<section class="card block" style="margin:16px 20px" aria-label="Annotation tasks">
<h2>Temporal Caption</h2><div class="row"><a data-caption-id="open-review">Open Temporal Caption Review →</a><a data-caption-id="open-jobs">Open Jobs →</a></div>
<form data-caption-id="caption-job-form" class="transport">
<label>Annotation method <select data-caption-id="job-scheme"></select></label>
<label>Episodes <select data-caption-id="episode-mode"><option value="range">Indices / ranges</option><option value="all">Entire dataset</option></select></label>
<label data-caption-id="range-label">Episode indices <input data-caption-id="job-episode" type="text" value="0" placeholder="0, 5, 10-20" required></label>
<label><input data-caption-id="include-signals" type="checkbox" checked> Include action/state, pose and gripper signals</label>
<button data-caption-id="job-submit" type="submit" disabled>Submit annotation jobs</button></form>
<p data-caption-id="method-description"></p><p data-caption-id="selection-summary"></p>
<p data-caption-id="job-readiness">Checking annotation executor…</p><p data-caption-id="job-status" role="status"></p>
<p>Each episode creates one job. Track progress, cancel, or retry in Jobs. Model API usage is charged per episode.</p>
</section>
