<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategies</title>
<style>body{font:14px system-ui;background:#020617;color:#e2e8f0;max-width:1100px;margin:auto;padding:24px}a{color:#7dd3fc}button,input,select,textarea{font:inherit;color:inherit;background:#0f172a;border:1px solid #475569;padding:8px;border-radius:6px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0}textarea{box-sizing:border-box;width:100%;min-height:150px}article,fieldset{border:1px solid #334155;border-radius:8px;padding:16px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#94a3b8}.error{color:#fda4af}.row{display:flex;gap:12px;flex-wrap:wrap}fieldset{min-width:0}input,select{box-sizing:border-box;max-width:100%}.row>label{min-width:0;max-width:100%}</style></head><body>
<div class="row"><h1>Strategies</h1><a href="/pipelines">Pipelines</a></div>
<p id="status" role="status" aria-live="polite">Loading…</p><button id="refresh">Refresh</button>
<p id="active"></p>
<details><summary>Experiment settings</summary><form id="settings"><fieldset><legend>Synthetic test environment</legend>
<label>Test operator <select id="executor" required></select></label><label>Test node <select id="node" required></select></label>
<label>v2.1 fixture <select id="v21" required></select></label><label>v3.0 fixture <select id="v30" required></select></label>
<label>v2.1 video fixture <select id="video-fixture" required></select></label>
<label><input id="automatic" type="checkbox"> Automatic experiments</label><label><input id="paused" type="checkbox" checked> Pause experiments</label>
<div class="row"><label>Model calls <input id="calls" type="number" min="1" value="1000"></label><label>Tokens <input id="tokens" type="number" min="1" value="1000000"></label><label>Active seconds <input id="seconds" type="number" min="1" value="14400"></label><label>Pipelines <input id="pipelines" type="number" min="1" value="12"></label></div>
<small>Only unchanged generated fixtures and a restricted test operator are accepted. Business tasks retain their confirmation flow.</small><p><button type="submit">Save settings</button></p></fieldset></form></details>
<h2>Evaluation sets</h2><button id="create-suite">Create initial set</button><details><summary>Import fresh evaluation cases</summary><label>Reviewed case JSON <textarea id="case-json" spellcheck="false"></textarea></label><button id="import-suite">Import set</button></details><div id="suites"></div>
<h2>Experiments</h2><div id="experiments"></div><h2>Versions</h2><div id="versions"></div>
<script>
(() => {const $=id=>document.getElementById(id), base='/api/ai-assistant/strategies';let state=null,busy=false,epoch=0;
const status=(text,error=false)=>{$('status').textContent=text;$('status').className=error?'error':'';};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v;}
function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
function details(parent,label,value){const d=document.createElement('details');text(d,'summary',label);text(d,'pre',JSON.stringify(value,null,2));parent.append(d);}
function button(parent,label,action,disabled,reason){const b=text(parent,'button',label);b.disabled=busy||disabled;b.title=reason||'';b.onclick=action;if(disabled&&reason)text(parent,'small',' '+reason+' ');}
async function change(action,value={}){if(busy||!state)return;busy=true;render();try{state=await api(base+'/'+action,'POST',{expected_revision:state.revision,...value});status('Saved.');}catch(e){status(e.message,true);}finally{busy=false;render();}}
function render(){if(!state)return;$('active').textContent=state.enabled?(state.active_id?'Active · '+state.active_id:'No shared strategy active'):'Shared strategies are disabled';
for(const id of ['suites','experiments','versions'])$(id).replaceChildren();
for(const s of state.suites){const a=text($('suites'),'article','');text(a,'strong',s.suite_id.slice(0,12));text(a,'p',s.consumed?'Used · new hidden cases required':s.reviewed?'Reviewed':'Review required');details(a,'Cases and expected behavior',s.cases);
button(a,'Approve cases',()=>change('review-suite',{suite_id:s.suite_id}),s.consumed||s.reviewed,s.consumed?'Already used':'');button(a,'Start experiment',()=>change('start',{suite_id:s.suite_id}),!state.experiments_enabled||!s.reviewed||s.consumed||!state.configuration?.executor_id||state.configuration.paused,'Requires enabled strategies, reviewed unused cases and an unpaused test environment.');}
for(const e of state.experiments){const a=text($('experiments'),'article','');text(a,'strong',e.experiment_id);text(a,'p',e.status);const m=e.state; text(a,'p',`${m.calls} calls · ${m.tokens} tokens · ${Math.round(m.seconds)} active seconds`);if(m.reason)text(a,'p',m.reason);details(a,'Results and paired measurements',m);if(['queued','generating','development','holdout','execution'].includes(e.status))button(a,'Cancel experiment',()=>change('cancel',{experiment_id:e.experiment_id}),false);}
for(const v of state.versions){const a=text($('versions'),'article','');text(a,'strong',v.version_id);text(a,'p',v.revoked?'Disabled':v.version_id===state.active_id?'Active':'Candidate / retained');details(a,'Workflow templates',v.specification);const parent=state.versions.find(p=>p.version_id===v.parent_id);if(parent){const old=parent.specification.templates.map(t=>JSON.stringify(t)),next=v.specification.templates.map(t=>JSON.stringify(t));details(a,'Changes from parent',{parent_id:v.parent_id,added:v.specification.templates.filter(t=>!old.includes(JSON.stringify(t))),removed:parent.specification.templates.filter(t=>!next.includes(JSON.stringify(t)))});}else text(a,'small',v.parent_id?'Parent version: '+v.parent_id:'Baseline: no shared strategy');const exp=state.experiments.find(e=>e.experiment_id===v.experiment_id);const eligible=exp?.status==='passed'&&exp.state.winner===v.version_id;
button(a,'Activate',()=>{if(confirm('Use this strategy for new matching requests?'))change('activate',{version_id:v.version_id});},v.revoked||!eligible||v.version_id===state.active_id,'Requires a complete passing experiment.');button(a,'Disable',()=>change('disable',{version_id:v.version_id}),v.revoked);}
if(!state.suites.length)text($('suites'),'p','No evaluation sets. Create the initial set, then review its expected behavior.');if(!state.experiments.length)text($('experiments'),'p','No experiments yet.');if(!state.versions.length)text($('versions'),'p','No candidate versions.');
for(const b of document.querySelectorAll('#settings button,#create-suite,#import-suite'))b.disabled=busy;}
function fill(select,rows,key,label,current){select.replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='Select';select.append(empty);for(const r of rows){const option=document.createElement('option');option.value=r[key];option.textContent=r[label]||r[key];select.append(option);}select.value=current||'';}
async function refresh(){const token=++epoch;status('Loading…');try{const data=await api(base+'/admin');if(token!==epoch)return;state=data;render();status('Ready.');const results=await Promise.allSettled([api('/api/auth/users'),api('/api/control/nodes'),api('/api/control/locations?summary=1')]);if(token!==epoch)return;const c=state.configuration;const [u,n,l]=results.map(r=>r.status==='fulfilled'?r.value:null);if(u)fill($('executor'),(u.users||[]).filter(x=>x.role==='operator'&&x.active),'user_id','username',c.executor_id);if(n)fill($('node'),n.nodes||[],'node_id','name',c.node_id);if(l){fill($('v21'),l.locations||[],'location_id','dataset_key',c.locations?.['v2.1']);fill($('v30'),l.locations||[],'location_id','dataset_key',c.locations?.['v3.0']);fill($('video-fixture'),l.locations||[],'location_id','dataset_key',c.locations?.['v2.1-video']);}for(const k of ['calls','tokens','seconds','pipelines'])$(k).value=c.budget?.[k]||({calls:1000,tokens:1000000,seconds:14400,pipelines:12}[k]);$('automatic').checked=!!c.automatic;$('paused').checked=c.paused!==false;if(results.some(r=>r.status==='rejected'))status('Strategy state loaded; some setup lists failed. Refresh to retry.',true);}catch(e){status(e.message,true);}}
$('settings').onsubmit=e=>{e.preventDefault();change('configure',{configuration:{automatic:$('automatic').checked,paused:$('paused').checked,executor_id:$('executor').value,node_id:$('node').value,locations:{'v2.1':$('v21').value,'v3.0':$('v30').value,'v2.1-video':$('video-fixture').value},budget:Object.fromEntries(['calls','tokens','seconds','pipelines'].map(k=>[k,Number($(k).value)]))}});};
$('refresh').onclick=refresh;$('create-suite').onclick=()=>change('suites');$('import-suite').onclick=()=>{try{change('suites',{cases:JSON.parse($('case-json').value)});}catch(e){status('Invalid case JSON',true);}};window.addEventListener('pagehide',()=>{epoch++;});refresh();})();
</script></body></html>
