  <style>
    :root,:host{color-scheme:dark;font:14px system-ui;background:#020617;color:#e2e8f0}
    body{margin:0}main{max-width:1100px;margin:auto;padding:24px}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    header{justify-content:space-between;margin-bottom:24px}h1{font-size:22px;margin:0}h2{font-size:16px}a{color:#7dd3fc}
    label{display:flex;gap:6px;flex-direction:column;min-width:0}input,select,textarea,button{font:inherit;color:inherit;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px;box-sizing:border-box}
    button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#075985}textarea{width:100%;min-height:70px;font-family:monospace}select{max-width:100%}
    article,section{border:1px solid #1e293b;border-radius:8px;padding:16px;margin:14px 0}article{background:#0b1222}
    .grow{flex:1;min-width:180px}.parameters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
    .muted{color:#94a3b8}.error{color:#fda4af}.ok{color:#86efac}pre{white-space:pre-wrap;overflow-wrap:anywhere}.step-title{justify-content:space-between}small{color:#94a3b8}#feedback{min-height:20px}
    @media(max-width:600px){main{padding:12px}.row>*{max-width:100%}.parameters{grid-template-columns:1fr}}
  </style>
<main data-can-edit="{{ 'true' if can_edit else 'false' }}">
  <header><h1>Pipelines</h1><nav><a href="/">Datasets</a> · <a href="/tasks">Jobs</a> · <a id="review-link" href="/curation">Review</a></nav></header>
  <div class="row">
    <label class="grow">Dataset<select id="location" aria-label="Dataset"><option value="">Choose a registered dataset</option></select></label>
    <label class="grow">Saved pipeline<select id="saved" aria-label="Saved pipeline"><option value="">New pipeline</option></select></label>
    <label class="grow">Name<input id="name" aria-label="Name" maxlength="128" value="New pipeline"></label>
  </div>
  <div id="feedback" role="status" aria-live="polite"></div>
  <div id="steps"></div>
  <div class="row"><button id="add" disabled>Add step</button><button id="preview">Preview</button><button id="save">Save version</button><button id="run" class="primary" disabled>Run saved version</button></div>
  <section id="preview-panel" hidden><h2>Plan preview</h2><pre id="preview-result"></pre></section>
  <label>Recent runs<select id="runs" aria-label="Recent runs"><option value="">Choose a run</option></select></label>
  <section id="run-panel" hidden><h2>Run</h2><p id="run-status"></p><div id="run-steps"></div>
    <div class="row"><button id="cancel">Cancel remaining steps</button><button id="retry">Retry failed step</button></div>
  </section>
  <p class="muted" id="scope-note">Steps run on the selected dataset's server. Review decisions open after their evidence is published.</p>
</main>
