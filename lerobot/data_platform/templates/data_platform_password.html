<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{{ 'Reset password' if reset else 'Change password' }} · Data Platform</title>
    <style>
        body { font: 16px system-ui; background: #080f1c; color: #e2e8f0; margin: 0; }
        main { max-width: 420px; margin: 10vh auto; padding: 28px; background: #101b2c; border-radius: 12px; }
        label { display: block; margin: 18px 0; } input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; }
        button { cursor: pointer; background: #0369a1; color: white; border: 0; } a { color: #7dd3fc; } #message { white-space: pre-wrap; }
    </style>
</head>
<body>
<main>
    <h1>{{ 'Reset password' if reset else 'Change password' }}</h1>
    <p>Use 10–256 characters. All existing sessions will be signed out.</p>
    <form id="password-form">
        {% if not reset %}<label>Current password<input id="current" type="password" autocomplete="current-password" required maxlength="256"></label>{% endif %}
        <label>New password<input id="new" type="password" autocomplete="new-password" required minlength="10" maxlength="256"></label>
        <label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="256"></label>
        <button id="submit">Save password</button>
    </form>
    <p id="message" role="status"></p>
    <a href="{{ '/login' if reset else '/' }}">{{ 'Back to sign in' if reset else 'Back to console' }}</a>
</main>
<script>
    const reset = {{ reset|tojson }};
    let token = window.location.hash.slice(1);
    if (reset) history.replaceState(null, '', window.location.pathname);
    const form = document.getElementById('password-form');
    const message = document.getElementById('message');
    const button = document.getElementById('submit');
    if (reset && !token) { form.hidden = true; message.textContent = 'Reset link is missing. Contact your administrator for a new link.'; }
    form.addEventListener('submit', async event => {
        event.preventDefault(); button.disabled = true; message.textContent = '';
        try {
            const status = await fetch('/api/auth/status', {cache: 'no-store'}).then(response => response.json());
            const response = await fetch(reset ? '/api/auth/reset-password' : '/api/auth/password', {
                method: 'POST', headers: {'Content-Type': 'application/json', 'X-Data-Platform-CSRF': status.csrf_token},
                body: JSON.stringify({token, current_password: document.getElementById('current')?.value,
                    new_password: document.getElementById('new').value, confirm_password: document.getElementById('confirm').value}),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Unable to save password');
            token = ''; form.reset(); form.hidden = true;
            message.textContent = 'Password updated. Sign in with your new password.';
            const link = document.querySelector('main > a'); link.href = '/login'; link.textContent = 'Sign in';
        } catch (error) { message.textContent = error.message; }
        finally { button.disabled = false; }
    });
</script>
</body>
</html>
