[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "data-platform-cli"
version = "0.3.17"
description = "Authenticated terminal client for the Data Platform assistant"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "prompt-toolkit>=3.0.52,<4", "rich>=13,<15"]

[project.scripts]
data-platform = "data_platform_cli.shell:main"
